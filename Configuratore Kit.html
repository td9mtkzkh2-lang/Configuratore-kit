<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Configuratore Kit</title>
<style>
:root{color-scheme:light;--bg:#fff;--card:#fff;--ink:#1a1a1a;--mute:#6b6b6b;--line:#e4e4e4;--acc:#c02c22;--acc-ink:#fff;--soft:#fbeceb;--res:#c02c22;--res-ink:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(170px + env(safe-area-inset-bottom))}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 14px;border-bottom:3px solid var(--acc)}.hd img{height:52px;width:auto}.hd span{font-weight:600;color:var(--mute);font-size:15px;text-align:right}
h2{color:var(--acc)!important}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:22px 0 8px;font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--line);padding:5px;border-radius:14px}
.seg button{border:0;background:transparent;color:var(--ink);font:inherit;font-weight:600;padding:14px 8px;border-radius:10px;min-height:52px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--acc);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.incl{padding:14px 16px;font-size:15px}
.incl b{display:block;margin-bottom:4px}
.incl ul{margin:0;padding-left:18px;color:var(--mute)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row .nm{font-weight:500}
.row.on{background:var(--soft)}
.step{display:flex;align-items:center;gap:4px}
.step button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:22px;font-weight:600;cursor:pointer;touch-action:manipulation}
.step button:active{background:var(--soft)}
.step button.p{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.step output{min-width:34px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--res);color:var(--res-ink);padding:14px 16px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(0,0,0,.25)}
.bar .in{max-width:760px;margin:0 auto}
.sum{font-size:13px;opacity:.75;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pr div{background:rgba(0,0,0,.16);border-radius:12px;padding:10px 12px}
.pr small{display:block;font-size:12px;opacity:.75}
.pr strong{font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pr em{font-style:normal;font-size:13px;opacity:.8}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;opacity:.75}
.foot button{background:none;border:1px solid rgba(255,255,255,.35);color:inherit;border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
@media(min-width:700px){.pr strong{font-size:32px}.row{padding:12px 18px}}
</style>
</head>

const D={"kits": {"base": {"nome": "Kit Base", "dev": ["Hub (2G)", "MotionProtect", "DoorProtect", "HomeSiren", "SpaceControl"], "con": {"canone": 34.2786, "ut": 242.78}, "senza": {"canone": 41.0225, "ut": 0}}, "foto": {"nome": "Kit Foto Verifica", "dev": ["Hub 2 (4G)", "MotionCam", "DoorProtect", "HomeSiren", "Keypad Plus"], "con": {"canone": 39.5483, "ut": 425.78}, "senza": {"canone": 51.3756, "ut": 0}}}, "extras": [{"n": "MotionProtect", "c": 1.89778, "u": 68.32}, {"n": "MotionProtect Outdoor", "c": 3.58883, "u": 129.198}, {"n": "MotionCam", "c": 4.26661, "u": 153.598}, {"n": "MotionCam Outdoor", "c": 6.64222, "u": 239.12}, {"n": "DoorProtect", "c": 1.22, "u": 43.92}, {"n": "DoorProtect Plus", "c": 1.72833, "u": 62.22}, {"n": "GlassProtect", "c": 1.72494, "u": 62.098}, {"n": "HomeSiren", "c": 1.89778, "u": 68.32}, {"n": "StreetSiren", "c": 3.25333, "u": 117.12}, {"n": "StreetSiren DoubleDeck", "c": 3.25333, "u": 117.12}, {"n": "KeyPad", "c": 2.91444, "u": 104.92}, {"n": "KeyPad TouchScreen", "c": 8.33667, "u": 300.12}, {"n": "SpaceControl", "c": 1.04717, "u": 37.698}, {"n": "Button", "c": 1.05056, "u": 37.82}, {"n": "ReX 2", "c": 4.60889, "u": 165.92}, {"n": "Hub 2 Plus", "c": 9.01444, "u": 324.52}]};
const st={kit:'base',ut:'con',dst:'canone',iva:'inc',q:D.extras.map(()=>0)};
const $=id=>document.getElementById(id);
const eur=n=>n.toLocaleString('it-IT',{style:'currency',currency:'EUR'});
function seg(el,opts,key){
  el.innerHTML='';
  opts.forEach(([v,l])=>{const b=document.createElement('button');b.type='button';b.textContent=l;
    b.setAttribute('aria-pressed',st[key]===v);b.onclick=()=>{st[key]=v;render()};el.appendChild(b)});
}
function render(){
  seg($('kit'),Object.entries(D.kits).map(([k,v])=>[k,v.nome]),'kit');
  seg($('ut'),[['con','Con una tantum'],['senza','Senza una tantum']],'ut');
  seg($('iva'),[['inc','IVA inclusa'],['esc','IVA esclusa']],'iva');
  seg($('dst'),[['canone','Canone mensile'],['ut','Una tantum']],'dst');
  const k=D.kits[st.kit];
  $('inc').innerHTML=k.dev.map(d=>'<li>'+d+'</li>').join('');
  $('ex').innerHTML='';
  D.extras.forEach((e,i)=>{
    const r=document.createElement('div');r.className='row'+(st.q[i]?' on':'');
    r.innerHTML='<span class="nm">'+e.n+'</span><span class="step"><button type="button" aria-label="Meno">−</button><output>'+st.q[i]+'</output><button type="button" class="p" aria-label="Più">+</button></span>';
    const [m,p]=r.querySelectorAll('button');
    m.onclick=()=>{if(st.q[i]>0){st.q[i]--;render()}};
    p.onclick=()=>{if(st.q[i]<30){st.q[i]++;render()}};
    $('ex').appendChild(r);
  });
  const o=k[st.ut];const f=st.iva==='inc'?1:1/1.22,tx=st.iva==='inc'?'IVA incl.':'IVA escl.';
  let c=o.canone,u=o.ut;D.extras.forEach((e,i)=>{if(st.dst==='canone')c+=e.c*st.q[i];else u+=e.u*st.q[i]});
  $('can').textContent=eur(Math.round(c*f*100)/100);
  $('unt').textContent=eur(Math.round(u*f*100)/100);
  $('lc').textContent='Canone mensile · '+tx;$('lu').textContent='Una tantum · '+tx;
  const add=D.extras.map((e,i)=>st.q[i]?st.q[i]+'× '+e.n:null).filter(Boolean);
  $('sum').textContent=k.nome+(add.length?' + '+add.join(', '):'');
}
$('rst').onclick=()=>{st.q=D.extras.map(()=>0);st.kit='base';st.ut='con';st.dst='canone';st.iva='inc';render()};
render();
</script>
